---
- name: Configure PHP test server
  hosts: test_servers
  become: true

  tasks:
    - name: Install Apache and PHP
      ansible.builtin.apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
          - php-sqlite3
          - sqlite3
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: Restart Apache

    - name: Create project directory
      ansible.builtin.file:
        path: /var/www/php-project
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Configure virtual host
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/php-project.conf
        mode: "0644"
        content: |
          <VirtualHost *:80>
              ServerName localhost
              DocumentRoot /var/www/php-project

              <Directory /var/www/php-project>
                  Require all granted
                  DirectoryIndex index.php
              </Directory>

              ErrorLog ${APACHE_LOG_DIR}/php-project-error.log
              CustomLog ${APACHE_LOG_DIR}/php-project-access.log combined
          </VirtualHost>
      notify: Restart Apache

    - name: Enable project virtual host
      ansible.builtin.command: a2ensite php-project.conf
      args:
        creates: /etc/apache2/sites-enabled/php-project.conf
      notify: Restart Apache

    - name: Disable default virtual host
      ansible.builtin.command: a2dissite 000-default.conf
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      notify: Restart Apache

    - name: Check Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    - name: Start Apache
      ansible.builtin.service:
        name: apache2
        state: started
        use: sysvinit

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
        use: sysvinit